[package]
name = "lilyco-bot"
version = "0.1.0"
edition = "2021"
description = "Multi-platform IM Bot backend for Lilyco (Telegram / QQ OneBot / WeChat iLink) — define App once, run as CLI, GUI, MCP, and Chat Bot"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Lyco-team/lilyco-bot"
keywords = ["lilyco", "telegram", "bot", "onebot", "wechat"]
categories = ["asynchronous", "network-programming"]

[features]
default = ["tg"]
# Telegram Bot via teloxide (MIT, crates.io top Telegram framework)
tg = ["dep:teloxide", "dep:reqwest"]
# QQ / OneBot v11 via onebot_v11 (NapCat / LLOneBot compatible)
qq = ["dep:onebot_v11"]
# WeChat iLink Bot via weixin-agent (MIT, pure protocol SDK)
wx = ["dep:weixin-agent"]

[dependencies]
lilyco-core = { git = "https://github.com/Lyco-team/lilyco.git", branch = "main" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"

# Optional platform adapters (only compile the IM you actually use)
teloxide = { version = "0.17", default-features = false, features = ["rustls", "ctrlc_handler"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"], optional = true }
onebot_v11 = { version = "0.1", optional = true }
weixin-agent = { version = "0.3", optional = true }

[dev-dependencies]
tracing-subscriber = "0.3"
